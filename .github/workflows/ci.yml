name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # without the libraries feature, only the driver API compiles
      - run: cargo clippy -p cudakit --all-targets -- -D warnings
      # GPU tests skip without CUDAKIT_REQUIRE_GPU=1; hosted runners have no GPU
      - run: cargo test --workspace --all-features
      - run: cargo package --workspace

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # docs.rs builds with nightly and `--cfg docsrs`
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
      # links to feature-gated items must not break the default-feature docs
      - run: cargo doc -p cudakit --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
