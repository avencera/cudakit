name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    # Windows builds and tests the same crates; neither runner has a GPU
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # without the libraries feature, only the driver API compiles
      - run: cargo clippy -p cudakit --all-targets -- -D warnings
      # GPU tests skip without CUDAKIT_REQUIRE_GPU=1; hosted runners have no GPU
      - run: cargo test --workspace --all-features
      # the crate READMEs and LICENSEs are symlinks, which a Windows checkout writes as
      # plain files holding the link's target, so only Linux packages
      - run: cargo package --workspace
        if: runner.os == 'Linux'

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # docs.rs builds with nightly and `--cfg docsrs`
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
      # links to feature-gated items must not break the default-feature docs
      - run: cargo doc -p cudakit --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
