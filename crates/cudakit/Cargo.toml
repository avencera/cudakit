[package]
name = "cudakit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Driver-only CUDA host stack: context, stream, embedded PTX/cubin modules, buffers, GEMM and graph capture, without libcudart"
publish = false

[features]
default = []
# optional numerical libraries, loaded at run time after a symbol preflight; a consumer's
# `Profile` still decides whether they may be requested
libraries = ["cudarc/cublas", "cudarc/cudnn"]
# serde for identities that consumers persist, such as the driver release
serde = ["dep:serde"]
# constructors for host-only tests in consumers; never enable outside dev-dependencies
test-support = []

[dependencies]
cudarc.workspace = true
libloading = "0.9.0"
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.10"
thiserror = "2.0.18"
tracing = "0.1.44"

[dev-dependencies]
serde_json = "1"

[[test]]
name = "gpu"
required-features = ["libraries", "test-support"]
